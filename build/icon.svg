<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f7"/>
      <stop offset="1" stop-color="#c3c3cc"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3eedf"/>
      <stop offset="1" stop-color="#d4c9ad"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4150"/>
      <stop offset="1" stop-color="#22262f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Tile (macOS-style margins: 100 px around an 824 px rounded square) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#000" stroke-opacity="0.12"/>
  <!-- Pinstripes -->
  <g stroke="#000" stroke-opacity="0.045" stroke-width="3">
    <line x1="170" y1="160" x2="854" y2="160"/><line x1="140" y1="178" x2="884" y2="178"/><line x1="122" y1="196" x2="902" y2="196"/>
  </g>

  <g filter="url(#shadow)">
    <!-- Foot -->
    <rect x="352" y="706" width="320" height="52" rx="14" fill="#c4b99c"/>
    <!-- Body -->
    <rect x="312" y="212" width="400" height="520" rx="44" fill="url(#body)"/>
  </g>
  <rect x="313" y="213" width="398" height="518" rx="43" fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="3"/>

  <!-- Bezel and screen -->
  <rect x="356" y="256" width="312" height="244" rx="26" fill="#c2b89d"/>
  <rect x="378" y="276" width="268" height="204" rx="18" fill="url(#screen)"/>

  <!-- Pixel "P" and cursor -->
  <g fill="#e6e9ef">
    <rect x="461" y="314" width="18" height="126"/>
    <rect x="479" y="314" width="54" height="18"/>
    <rect x="533" y="332" width="18" height="36"/>
    <rect x="479" y="368" width="54" height="18"/>
  </g>
  <rect x="569" y="422" width="36" height="18" fill="#7fb4ff"/>

  <!-- Floppy slot and grille -->
  <rect x="520" y="604" width="140" height="14" rx="7" fill="#6d6553"/>
  <g fill="#b5aa8d">
    <rect x="364" y="596" width="54" height="8" rx="4"/>
    <rect x="364" y="614" width="54" height="8" rx="4"/>
    <rect x="364" y="632" width="54" height="8" rx="4"/>
  </g>
</svg>
